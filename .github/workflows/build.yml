name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint and test
        run: ./gradlew ktlintCheck :composeApp:jvmTest :composeApp:koverXmlReport :composeApp:koverVerify :composeApp:compileKotlinJs :composeApp:compileKotlinWasmJs

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: composeApp/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Compute image tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build same-origin web distribution
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:wasmJsBrowserDistribution -PbackendUrl=

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jagieloadrian/statistics-ui:${{ steps.tag.outputs.tag }}

      - name: Deploy (bump image tag)
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i -E "s#(image: ghcr.io/jagieloadrian/statistics-ui):[^[:space:]]+#\1:${{ steps.tag.outputs.tag }}#" .devops/helm/release.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(deploy): ${{ steps.tag.outputs.tag }} [skip ci]"
          git pull --rebase && git push
