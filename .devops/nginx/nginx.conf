worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $status $level {
        ~^5 error;
        ~^4 warn;
        default info;
    }

    map $http_traceparent $trace_id {
        "~^[0-9a-f]{2}-(?<id>[0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $id;
        default "";
    }

    log_format json escape=json
        '{"timestamp":"$time_iso8601","level":"$level","logger":"nginx",'
        '"message":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"durationSeconds":$request_time,"remoteAddr":"$remote_addr",'
        '"userAgent":"$http_user_agent","traceId":"$trace_id"}';
    access_log /dev/stdout json;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 0.0.0.0:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        log_not_found off;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location = /health/ready {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }
    }
}
