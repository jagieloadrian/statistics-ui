apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: statistics-ui
  namespace: apps
spec:
  parentRefs:
    - name: home-gateway
      namespace: istio-ingress
      sectionName: http
  hostnames:
    - statistics.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: statistics-ui
          port: 80
