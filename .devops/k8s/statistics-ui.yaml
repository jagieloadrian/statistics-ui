apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-ui
  labels:
    app: statistics-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statistics-ui
  template:
    metadata:
      labels:
        app: statistics-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: statistics-ui
          image: ghcr.io/jagieloadrian/statistics-ui
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            # nginx pid and temp files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-ui
  labels:
    app: statistics-ui
spec:
  selector:
    app: statistics-ui
  ports:
    - name: http
      appProtocol: http
      port: 8080
      targetPort: http
